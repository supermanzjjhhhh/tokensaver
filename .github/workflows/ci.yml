name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test
        run: go test ./... -count=1
      - name: Race test
        run: go test ./... -count=1 -race -timeout=90s
      - name: Vet
        run: go vet ./...
      - name: Config checks
        run: scripts/check_configs.sh
      - name: Delivery gate
        run: python3 scripts/check_delivery.py
      - name: Build CPA plugin
        run: CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -ldflags='-s -w' -o /tmp/tokensaver-cpa.so ./cmd/cpaplugin
